
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <title>Cancel Registration</title>
</head>
<body>
    <main class="container confirmation-page">
        <h1>Are you sure?</h1>

        <p>Do you want to cancel your registration for
            <strong>{{ event_name }}</strong>?
        </p>

        <div class="confirmation-actions">
            <form action="{{ url_for('cancel_registration', registration_id=registration_id) }}"
                  method="POST">
                <button type="submit" class="btn">
                    Yes, Cancel
                </button>
            </form>

            <a href="{{ url_for('my_registrations') }}" class="btn">
                No, Go Back
            </a>
        </div>
    </main>
</body>
</html>
