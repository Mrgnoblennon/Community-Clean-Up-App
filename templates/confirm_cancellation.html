{% extends "base.html" %}

{% block title %}Cancel Registration{% endblock %}

{% block content %}
    <main class="container confirmation-page standard-page">
        <h1>Are you sure?</h1>

        <p>Do you want to cancel your registration for
            <strong>{{ event_name }}</strong>?
        </p>

        <div class="confirmation-actions">
            <form action="{{ url_for('cancel_registration', registration_id=registration_id) }}"
                  method="POST">
                <button type="submit" class="btn">
                    Yes, Cancel
                </button>
            </form>

            <a href="{{ url_for('my_registrations') }}" class="btn">
                No, Go Back
            </a>
        </div>
    </main>
{% endblock %}
