
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Become an Organiser</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="container">

        <header class="brand-header">
            <a href="{{ url_for('home') }}">
                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    alt="Cleaning Up Communities logo"
                    class="brand-logo"
                    style="max-width: 150px;"
                >
            </a>
        </header>

        <h1>Become an Organiser</h1>

        <p>
            Want to lead your own community clean-up?
            Create an organiser account to get started!
        </p>

        <section class="event-card">
            <h2>Create Your Account</h2>

            <form method="POST"
                  action="{{ url_for('register_organiser') }}">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your full name"
                    autocomplete="name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit" class="btn">
                    Create Organiser Account
                </button>
            </form>
        </section>

        <a href="{{ url_for('home') }}" class="btn">
            Back to Home
        </a>

    </main>
</body>
</html>
