{% extends "base.html" %}

{% block title %}Become an Organiser{% endblock %}

{% block content %}
    <main class="container standard-page">

<h1>Become an Organiser</h1>

        <p>
            Want to lead your own community clean-up?
            Create an organiser account to get started!
        </p>

        <section class="event-card">
            <h2>Create Your Account</h2>

            <form method="POST"
                  action="{{ url_for('register_organiser') }}">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your full name"
                    autocomplete="name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button type="submit" class="btn">
                    Create Organiser Account
                </button>
            </form>
        </section>

        <a href="{{ url_for('home') }}" class="btn">
            Back to Home
        </a>

    </main>
{% endblock %}
