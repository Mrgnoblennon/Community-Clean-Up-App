{% extends "base.html" %}

{% block title %}Join the Community{% endblock %}

{% block content %}
    <main class="container standard-page">

        <header class="site-header">
            <h1>Join the Community!</h1>
            <p>Create an account and start making a difference.</p>
        </header>

        <section class="event-card">
            <h2>Create Your Account</h2>

            <form method="POST" action="{{ url_for('register_participant') }}">

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" autocomplete="name"
                       placeholder="Your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" autocomplete="email"
                       placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password"
                       placeholder="Minimum 8 characters"
                       minlength="8" required>

                <button type="submit" class="btn">Create Account</button>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="{{ url_for('participant_login') }}">Log In</a>
            </p>
        </section>

        <div class="home-actions">
            <a href="{{ url_for('home') }}" class="btn">Back to Home</a>
        </div>

    </main>
{% endblock %}
