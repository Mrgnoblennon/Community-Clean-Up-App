{% extends "base.html" %}
{% block title %}Welcome Back | Clean-Up Communities{% endblock %}
{% block content %}
<main class="container standard-page auth-shell">
 <header class="auth-intro"><span class="auth-eyebrow">🌱 CLEANING UP COMMUNITIES</span><h1>Welcome Back</h1><p>Your next clean-up adventure starts here.</p></header>
 <section class="event-card auth-card"><div class="auth-card-icon" aria-hidden="true">👋</div><h2>Sign in to continue</h2>
 <form method="POST" action="{{ url_for('participant_login') }}" class="auth-form">
 
 <label for="email">Email address</label><input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
 <label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password"  required>
 <button type="submit" class="btn auth-submit">Log In</button>
 </form><p class="auth-footer"><a href="{{ url_for('register_participant') }}">Need an account? Register</a></p>
 </section><div class="auth-bottom"><a href="{{ url_for('organiser_login') }}">Organiser sign in</a> · <a href="{{ url_for('home') }}">Back to home</a></div>
</main>
{% endblock %}
