{% extends "base.html" %}

{% block title %}Participant Login{% endblock %}

{% block content %}
    <main class="container standard-page">

        <header class="site-header">
            <h1>Welcome Back!</h1>
            <p>Ready to make another difference?</p>
        </header>

        <section class="event-card">
            <h2>Participant Login</h2>

            <form method="POST" action="{{ url_for('participant_login') }}">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" autocomplete="email"
                       placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password"
                       placeholder="Your password" required>

                <button type="submit" class="btn">Log In</button>
            </form>

            <p class="auth-footer">
                New to the community?
                <a href="{{ url_for('register_participant') }}">Create an Account</a>
            </p>
        </section>

        <div class="home-actions">
            <a href="{{ url_for('home') }}" class="btn">Back to Home</a>
        </div>

    </main>
{% endblock %}
