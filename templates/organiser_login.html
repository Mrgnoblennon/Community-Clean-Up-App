
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organiser Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">

        <header class="brand-header">
            <a href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='images/logo.png') }}"
                     alt="Cleaning Up Communities"
                     class="brand-logo"
                     style="max-width: 150px;">
            </a>
        </header>

        <h1>Organiser Login</h1>
        <p>Welcome back! Sign in to manage your clean-up events.</p>

        <section class="event-card">
            <h2>Sign In</h2>

            <form method="POST">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>

                <button type="submit" class="btn">Log In</button>
            </form>
        </section>

        <a href="{{ url_for('register_organiser') }}" class="btn">
            Create Organiser Account
        </a>

        <a href="{{ url_for('home') }}" class="btn">
            Back to Home
        </a>

    </main>
</body>
</html>
