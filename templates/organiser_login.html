{% extends "base.html" %}

{% block title %}Organiser Login{% endblock %}

{% block content %}
    <main class="container standard-page">

<h1>Organiser Login</h1>
        <p>Welcome back! Sign in to manage your clean-up events.</p>

        <section class="event-card">
            <h2>Sign In</h2>

            <form method="POST">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>

                <button type="submit" class="btn">Log In</button>
            </form>
        </section>

        <a href="{{ url_for('register_organiser') }}" class="btn">
            Create Organiser Account
        </a>

        <a href="{{ url_for('home') }}" class="btn">
            Back to Home
        </a>

    </main>
{% endblock %}
