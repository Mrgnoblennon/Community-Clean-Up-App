{% extends "base.html" %}

{% block title %}Registration Confirmed{% endblock %}

{% block content %}
    <main class="container standard-page">
        <section class="event-card">  
            <h1>Registration Successful!</h1>
            <p>You've joined the clean-up event.</p>

            <h2>{{ event.name }}</h2>
            <p>Date: {{ event.date }}</p>
            <p>Time: {{ event.time }}</p>

            <a href="{{ url_for('events') }}" class="btn">
                Back to Events
            </a>
        </section>
    </main>
{% endblock %}
