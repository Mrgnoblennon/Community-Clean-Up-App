{% extends "base.html" %}

{% block title %}Edit Registration{% endblock %}

{% block content %}
    <main class="container standard-page">

<h1>Edit Registration</h1>

        <p>Update your clean-up registration details below.</p>

        <section class="event-card">
            <h2>Your Details</h2>

            <form method="POST">

                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ registration.name }}"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ registration.email }}"
                    readonly
                >

                <label for="attendee_count">Number of Attendees</label>

                <input
                    type="number"
                    id="attendee_count"
                    name="attendee_count"
                    min="1"
                    max="{{ max_attendees }}"
                    value="{{ registration.attendee_count }}"
                    required
                >

                <p>
                    You can book up to {{ max_attendees }} attendees,
                    including yourself.
                </p>

                <button type="submit" class="btn">
                    Save Changes
                </button>

            </form>
        </section>

        <a href="{{ url_for('my_registrations') }}" class="btn">
            Back to My Registrations
        </a>

    </main>
{% endblock %}
