<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Clean-Ups</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="container">
      <h1>Find Clean-Ups</h1>
      <p>Discover upcoming community clean-up events.</p>

      {% for event in events %}
      <section class="event-card">
        <h2>{{ event.name }}</h2>
        <p>Date: {{ event.date }}</p>
        <p>Time: {{ event.time }}</p>
        <p>{{ event.registered }} of {{ event.capacity }} participants registered</p>
        <a href="{{ url_for('event_details', event_id=event.id) }}" class="btn">
          View Details
        </a>
  
        <a href="{{ url_for('home') }}" class="btn">
          Back to Home
        </a>
      </section>
      {% endfor %}
  </main>
</body>
</html>
