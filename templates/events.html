<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Clean-Ups</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <main class="container">
      <header class="brand-header">
        <a href="{{ url_for('home') }}">
            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                alt="Cleaning Up Communities"
                class="brand-logo"
                style="max-width: 100px;"
            >
        </a>
      </header>
      <h1>Find Clean-Ups</h1>
      <p>Discover upcoming community clean-up events.</p>

      <div id="events-map" style="height: 400px; width: 100%;"></div>

      <form action="{{ url_for('events') }}" method="GET">
        <input
            type="search"
            name="search"
            placeholder="Search clean-up events"
            value="{{ search }}"
        >
        <button type="submit" class="btn">Search</button>
      </form>

      <label>
        <input type="checkbox" id="availableOnly">
        Show events with available spaces only
      </label>

      <label>
        <input type="checkbox" id="pastOnly">
        Show past events only
      </label>

      <a href="{{ url_for('home') }}" class="btn">
        Back to Home
      </a>

      {% for event in events %}
          <section class="event-card"
              data-registered="{{ event.registered }}"
              data-capacity="{{ event.capacity }}"
              data-date="{{ event.date }}"
              data-id="{{ event.id }}"
          >
          <h2>{{ event.name }}</h2>
          <p>Date: {{ event.date }}</p>
          <p>Time: {{ event.time }}</p>
          <p>{{ event.registered }} of {{ event.capacity }} participants registered</p>
          <a href="{{ url_for('event_details', event_id=event.id) }}" class="btn">
            View Details
          </a>
        </section>
      {% endfor %}

<!-- Convert Flask event data into JSON -->
<script id="events-data" type="application/json">
    {{ map_events | tojson }}
</script>

<script>
    // Initialise map
    const map = L.map("events-map").setView([-31.95, 115.86], 11);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const events = JSON.parse(
        document.getElementById("events-data").textContent
    );

    const markers = [];
    
    events.forEach(function(event) {
        const popup = document.createElement("div");

        const title = document.createElement("strong");
        title.textContent = event.name;
        popup.appendChild(title);

        const date = document.createElement("p");
        date.textContent = "Date: " + event.date;
        popup.appendChild(date);

        const link = document.createElement("a");
        link.href = event.url;
        link.textContent = "View Details";
        popup.appendChild(link);

        const marker = L.marker([event.latitude, event.longitude])
            .addTo(map)
            .bindPopup(popup);

        markers.push({
            marker: marker,
            eventId: event.id
        });
    });

    // Search functionality
    const searchInput = document.querySelector('input[name="search"]');

    searchInput.addEventListener("search", function () {
        if (searchInput.value === "") {
            window.location.href = "{{ url_for('events') }}";
        }
    });

    // Event filtering
    const availableOnly = document.getElementById("availableOnly");
    const pastOnly = document.getElementById("pastOnly");
    const eventCards = document.querySelectorAll(".event-card");

    function filterEvents() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        eventCards.forEach(function(card) {
            const registered = Number(card.dataset.registered);
            const capacity = Number(card.dataset.capacity);
            const eventDate = new Date(card.dataset.date + "T00:00:00");
        
            const isFull = registered >= capacity;
            const isPast = eventDate < today;
        
            let showCard = true;
        
            if (pastOnly.checked) {
                showCard = isPast;
            } else if (availableOnly.checked) {
                showCard = !isPast && !isFull;
            }
          
            card.style.display = showCard ? "block" : "none";
            const eventId = Number(card.dataset.id);

            markers.forEach(function(item) {
                if (item.eventId === eventId) {
                    if (showCard) {
                        item.marker.addTo(map);
                    } else {
                        map.removeLayer(item.marker);
                    }
                }
            });
        });
    }

    pastOnly.addEventListener("change", function () {
        if (pastOnly.checked) {
            availableOnly.checked = false;
        }
        filterEvents();
    });

    availableOnly.addEventListener("change", function () {
        if (availableOnly.checked) {
            pastOnly.checked = false;
        }
        filterEvents();
    });

    filterEvents();
  </script>
  </main>
</body>
</html>
