<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Clean-Up Event</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Create a Clean-Up Event</h1>

        <form method="POST">
            <label for="name">Event Name</label>
            <input type="text" id="name" name="name" required>

            <label for="location">Location</label>
            <input type="text" id="location" name="location" required>

            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Start Time</label>
            <input type="time" id="time" name="time" required>

            <label for="capacity">Participant Limit</label>
            <input type="number" id="capacity" name="capacity" min="1" required>

            <label for="description">Description</label>
            <textarea id="description" name="description"></textarea>

            <label for="equipment">Required Equipment</label>
            <textarea id="equipment" name="equipment"></textarea>

            <label>
                <input type="checkbox" name="safety_confirmed" required>
                I have reviewed the safety requirements for this event.
            </label>

            <button type="submit" class="btn">Create Event</button>
        </form>

        <a href="{{ url_for('events') }}">Back to Events</a>
    </main>
</body>
</html>
