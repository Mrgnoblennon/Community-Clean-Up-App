<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Clean-Up Event</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <main class="container">
        <header class="brand-header">
            <a href="{{ url_for('home') }}">
                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    alt="Cleaning Up Communities"
                    class="brand-logo"
                >
            </a>
        </header>
        <h1>Create a Clean-Up Event</h1>

        <form method="POST">
            <label for="name">Event Name</label>
            <input type="text" id="name" name="name" required>

            <label for="location">Location</label>
            <input type="text" id="location" name="location" required>
            <p>Click the map to choose the clean-up location.</p>

            <div id="location-map" style="height: 350px; width: 100%;"></div>

            <input type="hidden" id="latitude" name="latitude" required>
            <input type="hidden" id="longitude" name="longitude" required>

            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Start Time</label>
            <input type="time" id="time" name="time" required>

            <label for="capacity">Participant Limit</label>
            <input type="number" id="capacity" name="capacity" min="1" required>

            <label for="description">Description</label>
            <textarea id="description" name="description"></textarea>

            <label for="equipment">Required Equipment</label>
            <textarea id="equipment" name="equipment"></textarea>

            <label>
                <input type="checkbox" name="safety_confirmed" required>
                I have reviewed the safety requirements for this event.
            </label>

            <button type="submit" class="btn">Create Event</button>
        </form>

        <form action="{{ url_for('organiser_logout') }}" method="POST">
            <button type="submit" class="btn">
                Log Out
            </button>
        </form>
        <a href="/" class="btn">Back To Home</a>

    </main>
    <script>
        const map = L.map("location-map").setView([-31.95, 115.86], 11);
    
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
    
        let marker;
    
        map.on("click", function(event) {
            const latitude = event.latlng.lat;
            const longitude = event.latlng.lng;
    
            document.getElementById("latitude").value = latitude;
            document.getElementById("longitude").value = longitude;
    
            if (marker) {
                map.removeLayer(marker);
            }
    
            marker = L.marker([latitude, longitude]).addTo(map);
        });
    </script>
</body>
</html>
